# Rebuilds docs/data from the public sources every night and commits the result.
# GitHub Pages (Settings → Pages → Deploy from branch: main, /docs) then serves it.
name: Refresh data

on:
  schedule:
    # Every two hours while the House and Senate are usually in session (noon to midnight Eastern, Mon to Fri),
    # so a vote shows in the app within about two hours, plus the overnight run for anything late. Each run
    # takes about two minutes and commits only when something changed, so quiet days cost nothing.
    - cron: "17 7 * * *"          # 07:17 UTC daily (~3 AM Eastern)
    - cron: "17 16-23/2 * * 1-5"  # 16:17, 18:17, 20:17, 22:17 UTC weekdays (12:17 to 6:17 PM Eastern)
    - cron: "17 1-5/2 * * 2-6"    # 01:17, 03:17, 05:17 UTC Tue-Sat (9:17 PM to 1:17 AM Eastern)
  workflow_dispatch:

permissions:
  contents: write

concurrency: data-refresh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Build data
        env:
          CONGRESS: "119"
          SESSIONS: "1,2"
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}   # bill titles + CRS summaries (docs/data/bills.json)
        run: npm run build
      - name: Commit refreshed data and pages
        run: |
          git config user.name "John Hubert LLC"
          git config user.email "support@johnhubert.llc"
          git add docs/data docs/votes docs/members docs/sitemap.xml docs/pages.css
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
